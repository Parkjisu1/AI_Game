# LiteLLM 프록시 설정 — Mother 운영본 사본 (2026-10-14 동기화)
#
# 배포 위치: /home/aimed/hermes-config/litellm-config.yaml
# 서비스: litellm-proxy.service (EnvironmentFile ~/litellm-env/.env, --port 4000)
# 키는 os.environ 참조만. 이 파일을 바꾸면 Mother 운영본과 함께 바꿀 것 (어긋나면 옛 별칭이 되살아남).

model_list:
  # GPT-4o (고품질) — Main Coder 백업용
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # GPT-4o-mini (저가) — Sub Coder, Validator 주력
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # 역할 alias (Hermes가 이 이름으로 호출)
  # 2026-10-14: OpenAI 키 복구 → 09-09 의 Ollama 우회를 되돌림.
  #   실측(합성 프롬프트 3개): Ollama qwen3.6 33~80초·C# 리뷰 결함 누락 / gpt-4o-mini 2~4초·지적함.
  #   Ollama 는 *-local 별칭으로 남기고 router_settings.fallbacks 로 OpenAI 실패 시 자동 전환.
  - model_name: sub-coder-agent
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: validator-agent
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: sub-coder-agent-local
    litellm_params:
      model: ollama_chat/qwen3.6:35b-a3b
      api_base: http://127.0.0.1:11434
      timeout: 600

  - model_name: validator-agent-local
    litellm_params:
      model: ollama_chat/qwen3.6:35b-a3b
      api_base: http://127.0.0.1:11434
      timeout: 600

  - model_name: bulk-parser-agent
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # GPT Image 2 (이미지 생성) — Design 갤러리용
  - model_name: gpt-image-2
    litellm_params:
      model: openai/gpt-image-2
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  fallbacks:
    - sub-coder-agent: [sub-coder-agent-local]
    - validator-agent: [validator-agent-local]

litellm_settings:
  drop_params: true
  set_verbose: false
  # 폭주 방지 상한(프록시 전체). 6월 최대 사용량이 월 약 $3.
  max_budget: 20
  budget_duration: 30d
